services:
  daddy:
    build: .
    container_name: daddy_app
    restart: unless-stopped
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - PULSE_SERVER=host.docker.internal
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    tty: true
    stdin_open: true